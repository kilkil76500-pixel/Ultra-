[pytest]
# V19 — seuil de couverture minimal.
#
# Avant V19, la commande de couverture existait dans le README mais rien
# n'empêchait la couverture de baisser silencieusement d'une version à
# l'autre : `pytest --cov=engine --cov-report=term-missing` s'exécutait
# toujours avec succès quel que soit le résultat.
#
# --cov-fail-under fait échouer la commande sous ce seuil. Fixé délibérément
# en dessous de la couverture réelle actuelle du dépôt (marge de sécurité)
# pour ne pas casser la CI dès ce commit — à relever progressivement au fil
# des prochaines versions à mesure que la couverture augmente, jamais à
# baisser sans une raison explicite documentée ici.
addopts = --cov=engine --cov=bot --cov-report=term-missing --cov-fail-under=55

testpaths = engine/tests
